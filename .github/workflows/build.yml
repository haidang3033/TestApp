name: Build osine v0.6 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'RandoTone-v0.2.0-prototype-ci.zip'
      - 'tools/patch-randotone-v0.3.py'
      - 'tools/patch-osine-v0.4.py'
      - 'tools/hotfix-osine-v0.4-ci.py'
      - 'tools/patch-osine-v0.5.py'
      - 'tools/patch-osine-v0.6.py'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install proven Android SDK 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install verified Gradle 9.5.0
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ZIP="$RUNNER_TEMP/gradle-9.5.0-bin.zip"
          GRADLE_HOME="$RUNNER_TEMP/gradle-9.5.0"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -o "$GRADLE_ZIP" \
            "https://services.gradle.org/distributions/gradle-9.5.0-bin.zip"

          echo "553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746  $GRADLE_ZIP" | sha256sum -c -
          rm -rf "$GRADLE_HOME"
          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          test -x "$GRADLE_HOME/bin/gradle"
          echo "GRADLE_BIN=$GRADLE_HOME/bin/gradle" >> "$GITHUB_ENV"
          "$GRADLE_HOME/bin/gradle" --version

      - name: Assemble osine v0.6 source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q RandoTone-v0.2.0-prototype-ci.zip -d work
          PROJECT_DIR="$(find work -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/prototype-signing.keystore"

          python3 tools/patch-randotone-v0.3.py "$PROJECT_DIR"
          python3 tools/patch-osine-v0.4.py "$PROJECT_DIR"
          python3 tools/hotfix-osine-v0.4-ci.py "$PROJECT_DIR"
          python3 tools/patch-osine-v0.5.py "$PROJECT_DIR"
          python3 tools/patch-osine-v0.6.py "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify osine v0.6 foreground survival source
        shell: bash
        run: |
          set -euo pipefail
          APP_BUILD="$PROJECT_DIR/app/build.gradle.kts"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          STRINGS="$PROJECT_DIR/app/src/main/res/values/strings.xml"
          KOTLIN="$PROJECT_DIR/app/src/main/java/com/randotone/app"

          grep -q 'compileSdk = 36' "$APP_BUILD"
          grep -q 'targetSdk = 36' "$APP_BUILD"
          grep -q 'versionCode = 6' "$APP_BUILD"
          grep -q 'versionName = "0.6.0"' "$APP_BUILD"
          grep -q '<string name="app_name">osine</string>' "$STRINGS"

          grep -q 'android:name=".OsineApplication"' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$MANIFEST"
          grep -q 'android:name=".OsineKeepAliveService"' "$MANIFEST"
          grep -q 'android:stopWithTask="false"' "$MANIFEST"
          grep -q 'android:foregroundServiceType="specialUse"' "$MANIFEST"
          grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$MANIFEST"
          grep -q 'RECEIVE_BOOT_COMPLETED' "$MANIFEST"
          grep -q 'ListenerRecoveryReceiver' "$MANIFEST"
          grep -q 'android.intent.action.BOOT_COMPLETED' "$MANIFEST"
          grep -q 'android.service.notification.default_autobind_listenerservice' "$MANIFEST"

          grep -q 'object OsineOperation' "$KOTLIN/OsineOperation.kt"
          grep -q 'roulette_enabled' "$KOTLIN/OsineOperation.kt"
          grep -q 'ListenerRecovery.cancelPending' "$KOTLIN/OsineOperation.kt"
          grep -q 'NotificationListenerService.requestUnbind(component)' "$KOTLIN/OsineOperation.kt"
          grep -q 'OsineKeepAliveService.stop' "$KOTLIN/OsineOperation.kt"
          grep -q 'OsineKeepAliveService.startIfEnabled' "$KOTLIN/OsineOperation.kt"

          grep -q 'class OsineKeepAliveService' "$KOTLIN/OsineKeepAliveService.kt"
          grep -q 'FOREGROUND_SERVICE_TYPE_SPECIAL_USE' "$KOTLIN/OsineKeepAliveService.kt"
          grep -q 'return START_STICKY' "$KOTLIN/OsineKeepAliveService.kt"
          grep -q 'onTaskRemoved; service remains active' "$KOTLIN/OsineKeepAliveService.kt"
          grep -q 'watchdog listener-connected=false' "$KOTLIN/OsineKeepAliveService.kt"
          grep -q 'Notification sound roulette is running' "$KOTLIN/OsineKeepAliveService.kt"

          grep -q 'OsineOperation.init(this)' "$KOTLIN/OsineApplication.kt"
          grep -q 'ListenerRecovery.onProcessStart(this)' "$KOTLIN/OsineApplication.kt"

          grep -q 'roulette-off; no recovery scheduled' "$KOTLIN/ListenerRecovery.kt"
          grep -q 'pending recovery callbacks cancelled' "$KOTLIN/ListenerRecovery.kt"
          grep -q 'roulette-off-during-gap' "$KOTLIN/ListenerRecovery.kt"
          grep -q 'NotificationListenerService.requestUnbind(component)' "$KOTLIN/ListenerRecovery.kt"
          grep -q 'NotificationListenerService.requestRebind(component)' "$KOTLIN/ListenerRecovery.kt"
          grep -q 'hard-rebind submitted' "$KOTLIN/ListenerRecovery.kt"
          grep -q 'awaiting onListenerConnected' "$KOTLIN/ListenerRecovery.kt"
          grep -q 'hardRecoverForReceiver' "$KOTLIN/ListenerRecovery.kt"

          grep -q 'ignored reason=.*roulette-off' "$KOTLIN/ListenerRecoveryReceiver.kt"
          grep -q 'OsineKeepAliveService.startIfEnabled(app, "boot-completed")' "$KOTLIN/ListenerRecoveryReceiver.kt"
          grep -q 'goAsync()' "$KOTLIN/ListenerRecoveryReceiver.kt"

          grep -q 'OsineOperation.setEnabledFromState(enabled)' "$KOTLIN/RandoToneState.kt"
          grep -q 'connected while roulette-off; requesting unbind' "$KOTLIN/RandoToneNotificationListener.kt"
          grep -q 'if (!OsineOperation.isEnabled(applicationContext)) return' "$KOTLIN/RandoToneNotificationListener.kt"
          grep -q 'scheduleHealthCheck(applicationContext, "listener-disconnected")' "$KOTLIN/RandoToneNotificationListener.kt"
          grep -q 'android.substName' "$KOTLIN/RandoToneNotificationListener.kt"

          grep -q 'v0.6 prototype • foreground survival' "$KOTLIN/MainActivity.kt"
          grep -q 'OsineKeepAliveService.startIfEnabled(this, "activity-create")' "$KOTLIN/MainActivity.kt"
          grep -q 'OsineKeepAliveService.startIfEnabled(this, "activity-resume")' "$KOTLIN/MainActivity.kt"
          grep -q 'notificationAccessGranted && OsineOperation.isEnabled(this)' "$KOTLIN/MainActivity.kt"
          grep -q 'Roulette OFF is a full shutdown' "$KOTLIN/MainActivity.kt"
          grep -q 'OsineDiagnosticsSection' "$KOTLIN/MainActivity.kt"
          grep -q 'Deep repair listener' "$KOTLIN/MainActivity.kt"
          grep -q 'Battery optimisation settings' "$KOTLIN/MainActivity.kt"

          keytool -list \
            -keystore "$PROJECT_DIR/prototype-signing.keystore" \
            -storepass randotone-prototype \
            -alias randotone-prototype >/dev/null

          echo 'osine v0.6 foreground survival, master shutdown gate and signing identity verified.'

      - name: Build signed debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          "$GRADLE_BIN" --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show useful compiler errors on failure
        if: failure()
        shell: bash
        run: |
          echo "===== Compiler/build errors ====="
          if test -f build.log; then
            grep -nE '(^e: | error: |error: |\.kt:[0-9]+:[0-9]+|Android resource linking failed|Manifest merger failed|Could not resolve|SDK location not found|Foreground service)' build.log || true
          else
            echo 'Build did not reach Gradle compilation; inspect the failed setup or patch step above.'
          fi

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -f "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" dist/osine-v0.6.0-foreground-survival.apk
          sha256sum dist/osine-v0.6.0-foreground-survival.apk > dist/SHA256SUMS.txt
          keytool -list -v \
            -keystore "$PROJECT_DIR/prototype-signing.keystore" \
            -storepass randotone-prototype \
            -alias randotone-prototype \
            | grep -E 'SHA256:' > dist/SIGNING_CERT_SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: osine-v0.6.0-foreground-survival-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30
