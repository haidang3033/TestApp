name: Build osine v0.10 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'RandoTone-v0.2.0-prototype-ci.zip'
      - 'tools/patch-randotone-v0.3.py'
      - 'tools/patch-osine-v0.4.py'
      - 'tools/hotfix-osine-v0.4-ci.py'
      - 'tools/patch-osine-v0.5.py'
      - 'tools/patch-osine-v0.6.py'
      - 'tools/hotfix-osine-v0.6-ci.py'
      - 'tools/prepatch-osine-v0.7-manifest-shape.py'
      - 'tools/patch-osine-v0.7.py'
      - 'tools/patch-osine-v0.8.py'
      - 'tools/patch-osine-v0.9.py'
      - 'tools/patch-osine-v0.10.py'
      - '.github/workflows/build-osine-v010.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install verified Gradle 9.5.0
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ZIP="$RUNNER_TEMP/gradle-9.5.0-bin.zip"
          GRADLE_HOME="$RUNNER_TEMP/gradle-9.5.0"
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "$GRADLE_ZIP" \
            "https://services.gradle.org/distributions/gradle-9.5.0-bin.zip"
          echo "553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746  $GRADLE_ZIP" | sha256sum -c -
          rm -rf "$GRADLE_HOME"
          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          test -x "$GRADLE_HOME/bin/gradle"
          echo "GRADLE_BIN=$GRADLE_HOME/bin/gradle" >> "$GITHUB_ENV"

      - name: Assemble osine v0.10 source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch-osine-v0.10.py
          rm -rf work
          mkdir work
          unzip -q RandoTone-v0.2.0-prototype-ci.zip -d work
          PROJECT_DIR="$(find work -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/prototype-signing.keystore"

          python3 tools/patch-randotone-v0.3.py "$PROJECT_DIR"
          python3 tools/patch-osine-v0.4.py "$PROJECT_DIR"
          python3 tools/hotfix-osine-v0.4-ci.py "$PROJECT_DIR"
          python3 tools/patch-osine-v0.5.py "$PROJECT_DIR"
          python3 tools/patch-osine-v0.6.py "$PROJECT_DIR"
          python3 tools/hotfix-osine-v0.6-ci.py "$PROJECT_DIR"
          python3 tools/prepatch-osine-v0.7-manifest-shape.py "$PROJECT_DIR"
          python3 tools/patch-osine-v0.7.py "$PROJECT_DIR"
          python3 tools/patch-osine-v0.8.py "$PROJECT_DIR"
          python3 tools/patch-osine-v0.9.py "$PROJECT_DIR"
          python3 tools/patch-osine-v0.10.py "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify v0.10 invariants
        shell: bash
        run: |
          set -euo pipefail
          APP_BUILD="$PROJECT_DIR/app/build.gradle.kts"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          KOTLIN="$PROJECT_DIR/app/src/main/java/com/randotone/app"
          LISTENER="$KOTLIN/RandoToneNotificationListener.kt"
          ACTIVITY="$KOTLIN/MainActivity.kt"
          OPERATION="$KOTLIN/OsineOperation.kt"

          grep -q 'compileSdk = 36' "$APP_BUILD"
          grep -q 'targetSdk = 36' "$APP_BUILD"
          grep -q 'versionCode = 10' "$APP_BUILD"
          grep -q 'versionName = "0.10.0"' "$APP_BUILD"

          # Frozen v0.7 survival + no-vampires baseline.
          grep -q 'android.intent.action.LOCKED_BOOT_COMPLETED' "$MANIFEST"
          grep -A10 'android:name=".ListenerRecoveryReceiver"' "$MANIFEST" | grep -q 'android:directBootAware="true"'
          grep -A12 'android:name=".OsineKeepAliveService"' "$MANIFEST" | grep -q 'android:directBootAware="true"'
          grep -q 'android:stopWithTask="false"' "$MANIFEST"
          grep -q 'return START_STICKY' "$KOTLIN/OsineKeepAliveService.kt"
          grep -q 'ListenerRecovery.cancelPending' "$OPERATION"
          grep -q 'OsineKeepAliveService.stop' "$OPERATION"
          grep -q 'if (!OsineOperation.isEnabled(applicationContext)) return' "$LISTENER"

          # v0.9 hybrid app catalog must remain.
          grep -q 'fun loadAppCatalog()' "$KOTLIN/RandoToneRepository.kt"
          grep -q 'queryLaunchableApps' "$KOTLIN/RandoToneRepository.kt"
          grep -q 'seedActiveNotificationApps()' "$LISTENER"
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' "$MANIFEST"

          # Default disabled/custom-only semantics.
          test -f "$KOTLIN/OsineDefaultPolicy.kt"
          grep -q 'default_enabled' "$KOTLIN/OsineDefaultPolicy.kt"
          grep -q 'RuleKind.DEFAULT && !OsineDefaultPolicy.isEnabled' "$LISTENER"
          grep -q 'reason=fallback-disabled' "$LISTENER"
          grep -q 'Disabled • custom apps only' "$ACTIVITY"
          grep -q 'Master Roulette remains the power switch' "$ACTIVITY"

          # Left section navigation.
          grep -q 'private enum class OsineSection' "$ACTIVITY"
          grep -q 'NavigationRail' "$ACTIVITY"
          grep -q 'GENERAL("General"' "$ACTIVITY"
          grep -q 'APPS("Apps"' "$ACTIVITY"
          grep -q 'CALLS("Calls"' "$ACTIVITY"
          grep -q 'Per-app rules moved to Apps' "$ACTIVITY"
          grep -q 'when (selectedSection)' "$ACTIVITY"

          # Experimental Ringtone Lab: request/observe/clear call effects, but no ringtone player yet.
          test -f "$KOTLIN/OsineRingtoneLab.kt"
          grep -q 'HINT_HOST_DISABLE_CALL_EFFECTS' "$KOTLIN/OsineRingtoneLab.kt"
          grep -q 'requestListenerHints' "$KOTLIN/OsineRingtoneLab.kt"
          grep -q 'clearRequestedListenerHints' "$KOTLIN/OsineRingtoneLab.kt"
          grep -q 'currentListenerHints' "$KOTLIN/OsineRingtoneLab.kt"
          grep -q 'recordCallNotification' "$LISTENER"
          grep -q 'override fun onListenerHintsChanged' "$LISTENER"
          grep -q 'OsineRingtoneLab.clearBeforeOperationStop(app)' "$OPERATION"
          grep -q 'osine does not play a replacement ringtone yet' "$ACTIVITY"

          keytool -list \
            -keystore "$PROJECT_DIR/prototype-signing.keystore" \
            -storepass randotone-prototype \
            -alias randotone-prototype >/dev/null

          echo 'osine v0.10 survival, section navigation, custom-only default and Ringtone Lab invariants verified.'

      - name: Build signed debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          "$GRADLE_BIN" --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show useful compiler errors on failure
        if: failure()
        shell: bash
        run: |
          echo "===== Compiler/build errors ====="
          if test -f build.log; then
            grep -nE '(^e: | error: |error: |\.kt:[0-9]+:[0-9]+|Android resource linking failed|Manifest merger failed|Could not resolve|SDK location not found|NavigationRail|ListenerHints|Foreground service)' build.log || true
          else
            echo 'Build did not reach Gradle compilation; inspect the failed assembly/verification step.'
          fi

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" dist/osine-v0.10.0-ringtone-lab.apk
          sha256sum dist/osine-v0.10.0-ringtone-lab.apk > dist/SHA256SUMS.txt
          keytool -list -v \
            -keystore "$PROJECT_DIR/prototype-signing.keystore" \
            -storepass randotone-prototype \
            -alias randotone-prototype \
            | grep -E 'SHA256:' > dist/SIGNING_CERT_SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: osine-v0.10.0-ringtone-lab-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30
